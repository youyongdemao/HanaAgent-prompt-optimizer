<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提示词优化设置</title>
  <!-- 主题不在这里加载：交给 assets/theme-sync.js 跟随宿主（宿主窗口的真实变量 + SDK 订阅）。
       光读 iframe URL 里那份 hana-css 会停在创建时的初值上，显示成默认主题。 -->
  <link rel="stylesheet" href="./assets/settings.css">
  <link rel="stylesheet" href="./assets/update-notice.css">
</head>
<body class="is-settings" data-hana-theme="inherit">
  <div class="st-page">

    <section class="st-block">
      <h1 class="st-block-title">快捷候选提示词设置</h1>

      <section class="st-section">
        <div class="fx-add">
          <input class="fx-input fx-input-label" id="fxLabel" type="text" maxlength="12" placeholder="请输入提示词">
          <input class="fx-input" id="fxPrompt" type="text" placeholder="解释补充（可空）">
          <button class="st-btn st-btn-sm" id="fxAdd" type="button">添加</button>
        </div>
      </section>

      <section class="st-section">
        <div class="fx-card">
          <div class="fx-list" id="fxList"></div>
          <div class="fx-foot">
            <button class="st-btn" id="fxReset" type="button">恢复默认</button>
            <button class="st-btn st-btn-accent" id="fxSave" type="button">保存修改</button>
            <span class="st-status" id="fxStatus"></span>
          </div>
        </div>
      </section>
    </section>

    <section class="st-block">
      <h1 class="st-block-title">关于</h1>
      <section class="st-section">
        <ul class="st-list">
          <li class="st-item">
            <div class="st-item-main">
              <div class="st-item-title">版本</div>
            </div>
            <div class="st-item-ctl">
              <span class="st-item-value" id="aboutVersion">v–</span>
              <button class="st-btn st-btn-sm" id="aboutUpdate" type="button">更新</button>
            </div>
          </li>
          <li class="st-item">
            <div class="st-item-main">
              <div class="st-item-title">GitHub</div>
            </div>
            <div class="st-item-ctl">
              <a class="st-item-link" id="aboutGithub" href="https://github.com/youyongdemao" rel="noopener noreferrer">github.com/youyongdemao</a>
            </div>
          </li>
        </ul>
      </section>
    </section>

  </div>

  <script type="module" src="./assets/settings.js"></script>
</body>
</html>
