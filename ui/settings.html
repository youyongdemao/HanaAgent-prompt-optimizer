<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提示词优化设置</title>
  <script>
    // 初始主题：宿主只在主题"变化"时推送、不推初始值，页面需要自行从 hana-css 加载一次，
    // 之后由浏览器 SDK（hana.theme.subscribe）跟随变化。
    (() => {
      const advertisedUrl = new URLSearchParams(window.location.search).get("hana-css");
      if (!advertisedUrl) return;
      try {
        const stylesheetUrl = new URL(advertisedUrl, window.location.href);
        if (
          stylesheetUrl.origin !== window.location.origin ||
          (stylesheetUrl.protocol !== "http:" && stylesheetUrl.protocol !== "https:") ||
          stylesheetUrl.pathname !== "/api/apps/theme.css" ||
          !stylesheetUrl.searchParams.get("theme") ||
          stylesheetUrl.username ||
          stylesheetUrl.password ||
          stylesheetUrl.hash
        ) {
          throw new Error("invalid Hana theme stylesheet URL");
        }
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = stylesheetUrl.href;
        document.head.appendChild(link);
      } catch (error) {
        console.warn("[prompt-optimizer] 无法加载 Hana 主题样式", error);
      }
    })();
  </script>
  <link rel="stylesheet" href="./assets/settings.css">
  <link rel="stylesheet" href="./assets/update-notice.css">
</head>
<body data-hana-theme="inherit">
  <div class="st-page">

    <section class="st-block">
      <h1 class="st-block-title">关于</h1>
      <section class="st-section">
        <ul class="st-list">
          <li class="st-item">
            <div class="st-item-main">
              <div class="st-item-title">版本</div>
            </div>
            <div class="st-item-ctl">
              <span class="st-item-value" id="aboutVersion">v–</span>
              <button class="st-btn st-btn-sm" id="aboutUpdate" type="button">更新</button>
            </div>
          </li>
          <li class="st-item">
            <div class="st-item-main">
              <div class="st-item-title">GitHub</div>
            </div>
            <div class="st-item-ctl">
              <a class="st-item-link" id="aboutGithub" href="https://github.com/youyongdemao" rel="noopener noreferrer">github.com/youyongdemao</a>
            </div>
          </li>
        </ul>
      </section>
    </section>

  </div>

  <script type="module" src="./assets/settings.js"></script>
</body>
</html>
